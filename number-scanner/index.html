<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827"><title>Warehouse Number Scanner</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111827;background:#f3f4f6}*{box-sizing:border-box}body{margin:0}.app{max-width:620px;margin:auto;min-height:100vh;padding:calc(18px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom))}.hero{background:#111827;color:white;border-radius:24px;padding:24px;text-align:center;box-shadow:0 12px 30px #0002}.hero h1{font-size:24px;margin:0 0 6px}.hero p{opacity:.75;margin:0 0 22px}.camera{width:100%;border:0;border-radius:18px;padding:22px;background:white;color:#111827;font-weight:800;font-size:20px}.camera span{display:block;font-size:40px;margin-bottom:6px}.privacy{font-size:12px;opacity:.65;margin-top:14px}.card{background:white;border-radius:20px;padding:18px;margin-top:16px;box-shadow:0 4px 16px #0001}.hidden{display:none}.preview{width:100%;max-height:240px;object-fit:contain;border-radius:14px;background:#e5e7eb}.status{font-weight:700;margin:14px 0}.bar{height:8px;background:#e5e7eb;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:#111827;transition:width .25s}.result{display:flex;gap:10px;align-items:center;border:1px solid #e5e7eb;border-radius:15px;padding:13px;margin-top:10px}.num{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:22px;font-weight:800;word-break:break-all;flex:1}.copy{border:0;border-radius:10px;padding:10px 12px;font-weight:700}.actions{display:flex;gap:10px;margin-top:14px}.actions button{flex:1;padding:13px;border:0;border-radius:12px;font-weight:700}.primary{background:#111827;color:white}.danger{background:#fee2e2;color:#991b1b}details{margin-top:14px}pre{white-space:pre-wrap;word-break:break-word;background:#f9fafb;padding:12px;border-radius:12px;font-size:13px}.history-item{padding:12px 0;border-bottom:1px solid #eee}.history-item:last-child{border:0}.time{font-size:12px;color:#6b7280;margin-bottom:4px}.empty{color:#6b7280}.note{font-size:12px;color:#6b7280;line-height:1.4;margin-top:10px}

button{cursor:pointer;min-height:48px;font-size:16px;touch-action:manipulation}button:disabled{opacity:.45;cursor:default}button:focus-visible{outline:3px solid #38bdf8;outline-offset:3px}
#video{width:100%;max-height:55vh;object-fit:contain;background:#000;border-radius:14px;margin-top:16px}
#cameraStatus{line-height:1.5;margin:12px 0 0}
textarea{width:100%;min-height:150px;font:16px/1.5 ui-monospace,monospace;padding:12px;border:1px solid #d1d5db;border-radius:12px;resize:vertical}
[hidden]{display:none!important}.privacy{opacity:.85;line-height:1.5}
</style>
</head><body><main class="app">
<section class="hero"><h1>Number Scanner</h1><p>Grab product &amp; order numbers fast</p>
<button id="openCamera" class="camera">Open Camera</button>
<video id="video" autoplay muted playsinline hidden aria-label="Live rear camera"></video>
<div class="actions"><button id="capture" disabled hidden>Capture &amp; Scan</button><button id="stopCamera" hidden>Close Camera</button></div>
<p id="cameraStatus" role="status">Open the camera, point at clear text, then capture.</p>
<div class="privacy">Images stay in this browser. Nothing is uploaded or saved to Photos. Only text is kept in Recent Scans.</div></section>
<section id="scanCard" class="card hidden">
<div id="status" class="status" role="status" aria-live="polite"></div><div class="bar"><i id="progress"></i></div>
<div id="results"></div>
<div class="actions"><button id="copyNumbers" disabled>Copy All Numbers</button></div>
<h2><label for="raw">Extracted Text</label></h2><textarea id="raw" placeholder="Scanned text appears here. You can correct it before copying."></textarea>
<div class="actions"><button id="copyText" disabled>Copy Text</button><button class="primary" id="scanAgain">Scan Again</button></div>
<p id="copyStatus" role="status" aria-live="polite"></p>
<div class="note">OCR can confuse 0/O, 1/I, 5/S and 8/B. Check the result before using it.</div></section>
<section class="card"><h2 style="margin-top:0">Recent Scans</h2><div id="history"></div><div class="actions"><button class="danger" id="clear">Clear History</button></div></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const scanCard=$('scanCard'),statusEl=$('status'),progress=$('progress'),results=$('results'),raw=$('raw');
const video=$('video'),openButton=$('openCamera'),capture=$('capture'),stopButton=$('stopCamera'),cameraStatus=$('cameraStatus');
let stream=null, busy=false, opening=false, cameraGeneration=0, worker=null, numbers=[];
const canvas=document.createElement('canvas');
const KEY='warehouseScannerHistoryV1';
function getHistory(){try{const h=JSON.parse(localStorage.getItem(KEY)||'[]');return Array.isArray(h)?h.filter(x=>x&&Array.isArray(x.nums)&&x.nums.every(n=>typeof n==='string')):[]}catch{return[]}}
function setHistory(v){try{localStorage.setItem(KEY,JSON.stringify(v.slice(0,30)))}catch{}renderHistory()}
function escapeHtml(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function extractNumbers(text){
  // Preserve leading zeroes, decimals, signs, fractions and product/order codes.
  const tokens=text.match(/[-+]?(?:[A-Za-z0-9]+(?:[._\/-][A-Za-z0-9]+)*|\.\d+)(?:,\d{3})*(?:\.\d+)?/g)||[];
  return [...new Set(tokens.filter(t=>/\d/.test(t)))];
}
async function copyValue(value){
  if(!value)return;
  try{
    if(navigator.clipboard&&window.isSecureContext) await navigator.clipboard.writeText(value);
    else throw new Error('fallback');
    $('copyStatus').textContent='Copied.';
  }catch{
    const helper=document.createElement('textarea');helper.value=value;
    helper.style.cssText='position:fixed;top:0;left:0;width:1px;height:1px;opacity:0';
    document.body.appendChild(helper);helper.focus();helper.select();helper.setSelectionRange(0,value.length);
    let copied=false;try{copied=document.execCommand('copy')}catch{}
    helper.remove();
    $('copyStatus').textContent=copied?'Copied.':'Copy unavailable. Touch and hold the extracted text to select and copy.';
  }
}
function showResults(nums){
  results.innerHTML=nums.length?'<h2>Numbers &amp; Codes Found</h2>':'<p class="empty">No numbers found. Check the extracted text below.</p>';
  nums.forEach(n=>{
    const row=document.createElement('div');row.className='result';
    const label=document.createElement('div');label.className='num';label.textContent=n;
    const button=document.createElement('button');button.className='copy';button.textContent='Copy';
    button.setAttribute('aria-label','Copy '+n);button.onclick=()=>copyValue(n);
    row.append(label,button);results.appendChild(row);
  });
}
function renderHistory(){const h=getHistory(), el=document.getElementById('history');if(!h.length){el.innerHTML='<div class="empty">No scans yet.</div>';return}el.innerHTML=h.map(x=>`<div class="history-item"><div class="time">${escapeHtml(new Date(x.time).toLocaleString())}</div><div class="num" style="font-size:17px">${x.nums.map(escapeHtml).join(' · ')||'No number detected'}</div></div>`).join('')}

$('clear').onclick=()=>{try{localStorage.removeItem(KEY)}catch{}renderHistory()};renderHistory();
function stopCamera(){
  cameraGeneration++;
  if(stream)stream.getTracks().forEach(t=>t.stop());
  stream=null;video.srcObject=null;video.hidden=true;capture.hidden=true;capture.disabled=true;
  stopButton.hidden=true;openButton.hidden=false;openButton.disabled=busy;
}
async function openCamera(){
  if(busy||opening)return;
  opening=true;openButton.disabled=true;
  const generation=++cameraGeneration;
  cameraStatus.textContent='Allow camera access when prompted.';
  try{
    if(!window.isSecureContext||!navigator.mediaDevices?.getUserMedia)
      throw new Error('secure');
    const next=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}}});
    if(generation!==cameraGeneration){next.getTracks().forEach(t=>t.stop());return}
    stream=next;video.srcObject=stream;video.hidden=false;await video.play();
    if(generation!==cameraGeneration)return;
    openButton.hidden=true;capture.hidden=false;stopButton.hidden=false;
    capture.disabled=video.readyState<2||!video.videoWidth;
    cameraStatus.textContent='Point at the text. Hold steady, then tap Capture & Scan.';
  }catch(e){
    if(generation!==cameraGeneration)return;
    stopCamera();
    cameraStatus.textContent=e.message==='secure'?'Open the published HTTPS website in Safari to use the camera.':
      e.name==='NotAllowedError'?'Camera access is blocked. Allow Camera in Safari website settings, then tap Open Camera.':
      e.name==='NotFoundError'?'No camera was found on this device.':
      'Camera could not start. Close other camera apps and tap Open Camera to retry.';
  }finally{opening=false;openButton.disabled=busy}
}
video.addEventListener('loadeddata',()=>{if(stream&&!busy)capture.disabled=false});
openButton.onclick=openCamera;
stopButton.onclick=()=>{stopCamera();cameraStatus.textContent='Camera closed. Tap Open Camera to resume.'};
$('scanAgain').onclick=()=>{if(busy)return;scanCard.classList.add('hidden');raw.value='';results.innerHTML='';numbers=[];$('copyText').disabled=true;$('copyNumbers').disabled=true;$('copyStatus').textContent='';openCamera()};
$('copyText').onclick=()=>copyValue(raw.value);
$('copyNumbers').onclick=()=>copyValue(numbers.join('\n'));
raw.oninput=()=>{$('copyText').disabled=!raw.value.trim()};
capture.onclick=async()=>{
  if(busy||!stream||video.readyState<2||!video.videoWidth)return;
  busy=true;capture.disabled=true;$('scanAgain').disabled=true;openButton.disabled=true;
  scanCard.classList.remove('hidden');raw.value='';results.innerHTML='';numbers=[];
  $('copyText').disabled=true;$('copyNumbers').disabled=true;$('copyStatus').textContent='';
  statusEl.textContent='Loading local OCR engine…';progress.style.width='2%';
  let timer, active=true;
  try{
    const scale=Math.min(1,2200/Math.max(video.videoWidth,video.videoHeight));
    canvas.width=Math.round(video.videoWidth*scale);canvas.height=Math.round(video.videoHeight*scale);
    canvas.getContext('2d').drawImage(video,0,0,canvas.width,canvas.height);
    stopCamera();cameraStatus.textContent='Capture complete. Camera is off.';
    const work=async()=>{
      if(!window.Tesseract)throw new Error('OCR engine unavailable');
      const acquired=await Tesseract.createWorker('eng',1,{
        logger:m=>{if(busy&&m.status){statusEl.textContent=m.status+'…';if(m.progress!=null)progress.style.width=Math.round(m.progress*100)+'%'}},
        errorHandler:()=>{}
      });
      if(!active){await acquired.terminate();throw new Error('expired')}
      worker=acquired;
      return worker.recognize(canvas);
    };
    const ret=await Promise.race([work(),new Promise((_,reject)=>{timer=setTimeout(()=>reject(new Error('timeout')),90000)})]);
    const text=(ret.data.text||'').trim();numbers=extractNumbers(text);raw.value=text;showResults(numbers);
    $('copyText').disabled=!text;$('copyNumbers').disabled=!numbers.length;
    statusEl.textContent=text?'Scan complete':'No text detected. Try closer, brighter, and steadier.';
    progress.style.width='100%';
    if(text){const h=getHistory();h.unshift({time:Date.now(),nums:numbers,text:text.slice(0,1200)});setHistory(h)}
  }catch(e){
    statusEl.textContent='Scan failed. Tap Scan Again to retry. An internet connection is needed to download the OCR engine.';
    if(worker){worker.terminate().catch(()=>{});worker=null}
  }finally{
    active=false;clearTimeout(timer);if(worker){worker.terminate().catch(()=>{});worker=null}canvas.width=0;canvas.height=0;
    busy=false;$('scanAgain').disabled=false;openButton.disabled=false;
  }
};
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){stopCamera();cameraStatus.textContent='Camera paused. Tap Open Camera to resume.'}
});
window.addEventListener('pagehide',()=>{stopCamera();if(worker){worker.terminate().catch(()=>{});worker=null}});
</script></body></html>
